[project]
name = "unwind"
version = "0.1.0"
description = "Retractable decisions: when a premise dies, everything built on it raises its hand."
# ⚠ NO UPPER BOUND, DELIBERATELY. `<3.13` here broke the first Cloud Run build:
# Google's Python buildpack picks the LATEST supported interpreter when the
# source pins none, and pip then refuses the project outright --
#   ERROR: Package 'unwind' requires a different Python: 3.13.12 not in '<3.13,>=3.12'
# -- which exits 1 and fails the build step. The ceiling was never earned: the
# full suite passes on 3.13 (249 passed, 11 skipped). CI still pins 3.12.
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.6.3",
    # <2.29.0, DELIBERATELY -- not stylistic caution, a real regression.
    # 2.29.0 (published 2026-08-24, PyPI upload_time) broke real (non-emulator)
    # Firestore access: `firestore.Client(project=..., database="(default)")`
    # -- the literal string `gcloud firestore databases list` itself reports
    # as this project's database id -- started raising `InvalidArgument: 400
    # Invalid database id %28default%29` under 2.29.0, live, on the deployed
    # Cloud Run service (2026-08-25; see evidence/INDEX.md). 2.28.1 (this
    # dev environment's own locked version) does not have the bug; verified
    # by reproducing the exact same call locally against the exact same
    # project and database with 2.28.1 -- it succeeds. The unpinned
    # `>=2.19.0` this line used to read let a routine redeploy silently pull
    # a regression the moment it hit PyPI, with no code change of this
    # project's own to explain it.
    "google-cloud-firestore>=2.19.0,<2.29.0",
    "google-cloud-pubsub>=2.27.0",
    "google-cloud-storage>=2.19.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "pydantic>=2.9.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
# Cloud Trace export is only reachable with credentials; kept out of the default
# install so a cold clone with no GCP account still resolves.
cloud = ["opentelemetry-exporter-gcp-trace>=1.7.0"]
dev = [
  "playwright>=1.40",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # PINNED, NOT FLOORED. `ruff>=0.7.0` was the defect that turned CI red for
    # 25 consecutive runs from 2026-08-13: CI installs the newest ruff, whose
    # formatter legitimately disagreed with the committed formatting, and the
    # Lint step is step 4 of 9 -- so the test suite, the corpus determinism
    # check, the eval harness AND `eval-vertex-off` (the zero-model guarantee
    # this repository's README calls a required check) all silently stopped
    # running. A formatter is a moving target; a moving target must be pinned
    # or it is not a gate, it is a coin flip.
    "ruff==0.16.3",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "agents", "services", "corpus", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by the formatter.
# UP042: `str, Enum` is kept over `StrEnum` deliberately. StrEnum changes what
#        `str(member)` returns, and these enums are serialised into Firestore
#        documents and Pub/Sub payloads where a silent change of wire format
#        would be expensive to notice.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("no function call in an argument default") is correct for mutable
# defaults and WRONG for FastAPI's dependency markers: `Depends(...)` and
# `Query(...)` in a parameter default are the framework's declaration syntax,
# not a default value that gets shared across calls. Declaring them immutable
# is bugbear's own documented configuration for this, which is why it is done
# here rather than with a `# noqa` on twelve endpoints -- a per-line
# suppression would also silence a genuine B008 on the next line someone adds.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
